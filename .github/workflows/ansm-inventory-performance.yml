name: ANSM synthetic low-memory inventory performance
on:
  pull_request:
    paths:
      - '.github/workflows/ansm-inventory-performance.yml'
      - 'scripts/*ansm*native*performance.py'
      - 'scripts/configure_ansm_low_memory_avd.py'
      - 'docs/ansm-integration/p4/performance/**'
      - 'core/data/src/main/java/net/plainnotes/app/data/MeasuredConsumptionStore.kt'
      - 'core/data/src/main/java/net/plainnotes/app/data/ReferencePayload.kt'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ansm-perf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-api26-large-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: |
          sudo chmod a+rw /dev/kvm
          mkdir -p core/data/build/reports/ansm-native-performance
          python3 scripts/prepare_ansm_native_performance.py > core/data/build/reports/ansm-native-performance/source.json
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 26
          arch: x86
          disable-animations: true
          ram-size: 512M
          heap-size: 192M
          pre-emulator-launch-script: python3 scripts/configure_ansm_low_memory_avd.py
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 512 -qemu -m 512
          script: |
            python3 scripts/run_ansm_native_performance.py
      - name: Remove generated test source
        if: always()
        run: python3 scripts/prepare_ansm_native_performance.py --clean
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ansm-native-api26-large-inventory
          path: |
            core/data/build/reports/ansm-native-performance/
            core/data/build/reports/androidTests/
