name: Verify published release assets
on:
  push:
    branches: [claude/new-session-1959qb]
    paths:
      - .github/release-assets.json
      - .github/workflows/release-assets.yml
      - scripts/upload_release_assets.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-assets
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify published hotfix hashes and source tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upload_release_assets.py
