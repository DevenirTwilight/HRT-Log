name: Android and domain checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew -PjvmOnly :core:domain:test :pk-engine:test :importer:test :attachment-poc:test --rerun-tasks --no-parallel --max-workers=2
      - name: Lightweight scientific contracts and four-language checks
        run: |
          python3 -m unittest discover -s scripts -p 'test_attachment_design_validation.py'
          python3 -m unittest discover -s scripts -p 'test_attachment_release_isolation.py'
          python3 scripts/generate_unified_model_reference.py --check
          python3 scripts/check_unified_concentration.py
          python3 -m unittest discover -s scripts -p 'test_collect_unified_device_performance.py'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: routine-science-results
          path: /tmp/hrt-p2-ci/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jvm-test-results
          path: |
            core/domain/build/test-results/test/
            pk-engine/build/test-results/test/
            importer/build/test-results/test/
            tools/attachment-poc/build/test-results/test/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Resolve Robolectric android-all jars through Gradle (no download at test time)
        run: ./gradlew robolectricJars
      - run: ./gradlew -ProbolectricDir="$GITHUB_WORKSPACE/build/robolectric-jars" :core:data:testDebugUnitTest --rerun :core:reminder:testDebugUnitTest --rerun :app:testFullDebugUnitTest --rerun lintFullDebug :app:assembleFullDebug :app:assembleFullRelease :core:data:assembleDebugAndroidTest :app:assembleFullDebugAndroidTest
        env:
          ANSM_P2_SHOTS: ci
      - name: Sublingual immutable P0/P1-A/P1-B/P1-C1 replay and P1-C2 disposition acceptance
        run: |
          python3 -m unittest discover -s tools/pk-audit -p 'test_*.py'
          ./gradlew -PjvmOnly :pk-engine:test --tests '*SublingualP0AuditTest' --tests '*SublingualP1ATest' --tests '*BaselineEligibilityTest' --tests '*CausalEvaluationTest' --tests '*LabDispositionTest' --rerun-tasks --no-parallel --max-workers=2
          python3 tools/pk-audit/sublingual_compare.py --engine docs/pk-research/results/sublingual-p0-engine.json --calculator docs/pk-research/results/sublingual-p0-calculator.json --output app/build/reports/pk-p0-comparison
          python3 tools/pk-audit/sublingual_p1a_compare.py --engine docs/pk-research/results/sublingual-p1a-engine.json --calculator docs/pk-research/results/sublingual-p1a-calculator.json --stability docs/pk-research/results/sublingual-p1a-stability.json --output app/build/reports/pk-p1a-comparison
          python3 tools/pk-audit/sublingual_p1b_compare.py --engine docs/pk-research/results/sublingual-p1b-engine.json --calculator docs/pk-research/results/sublingual-p1b-calculator.json --eligibility docs/pk-research/results/sublingual-p1b-eligibility.json --output app/build/reports/pk-p1b-comparison
          python3 tools/pk-audit/sublingual_p1c1_compare.py --after docs/pk-research/results/sublingual-p1c1-after.json --engine docs/pk-research/results/sublingual-p1c1-engine.json --calculator docs/pk-research/results/sublingual-p1c1-calculator.json --eligibility docs/pk-research/results/sublingual-p1c1-eligibility.json --output app/build/reports/pk-p1c1-comparison
          python3 tools/pk-audit/sublingual_p1c2_compare.py --output app/build/reports/pk-p1c2-comparison
      - run: python3 scripts/check_release_manifest.py
      - name: Exclude experimental attachment code and providers from release payload
        run: python3 scripts/check_attachment_release_isolation.py
      - name: Exclude ANSM test-only measurement and shadow integration from release
        run: python3 scripts/check_ansm03b0_isolation.py
      # Audit B1 / D-4: the R8-shrunk Release APK must name exactly this commit from a clean checkout, and the delivery
      # ledger keeps delivered versionCodes strictly increasing (source, APK and certificate identities kept apart).
      - name: Release APK source identity and delivery ledger
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/delivery_ledger.py check
          python3 scripts/apk_provenance.py "$ANDROID_HOME/build-tools/37.0.0" app/build/outputs/apk/full/release/app-full-release-unsigned.apk --expect-source-sha "$GITHUB_SHA"
      - run: git diff --exit-code -- core/data/schemas docs/PLAN.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-results
          path: |
            app/build/reports/tests/
            app/build/ansm-p2-ui-shots/ci/
            app/build/reports/pk-p0/
            app/build/reports/pk-p0-comparison/
            pk-engine/build/reports/pk-p0/
            pk-engine/build/reports/pk-p1a/
            app/build/reports/pk-p1a/
            app/build/reports/pk-p1a-comparison/
            pk-engine/build/reports/pk-p1b/
            app/build/reports/pk-p1b/
            app/build/reports/pk-p1b-comparison/
            pk-engine/build/reports/pk-p1c1/
            app/build/reports/pk-p1c1/
            app/build/reports/pk-p1c1-comparison/
            pk-engine/build/reports/pk-p1c2/
            app/build/reports/pk-p1c2/
            app/build/reports/pk-p1c2-comparison/
            app/build/reports/lint-results-*
            core/*/build/reports/tests/
            core/data/build/reports/ansm03b0/
            pk-engine/build/reports/tests/
            importer/build/reports/tests/
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Bound SDK/emulator hangs without skipping device tests.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :core:data:connectedDebugAndroidTest --no-parallel --max-workers=2
            python3 scripts/run_attachment_foundation_restart.py
            python3 scripts/run_attachment_gate2_red.py
            python3 scripts/run_attachment_gate2_restart.py AFTER_CREATE
            python3 scripts/run_attachment_gate2_restart.py WRITE
            python3 scripts/run_attachment_gate2_restart.py IN_COMMIT
            python3 scripts/run_attachment_gate2_restart.py AFTER_COMMIT
            python3 scripts/run_b3_gate_restart.py BEFORE_COMMIT
            python3 scripts/run_b3_gate_restart.py AFTER_COMMIT
            python3 scripts/run_b3_gate_red.py
            adb logcat -G 16M
            ./gradlew :app:connectedFullDebugAndroidTest --no-parallel --max-workers=2
            python3 scripts/collect_package_history_evidence.py --output app/build/reports/package-history-evidence.json
            python3 scripts/collect_unified_device_performance.py --output app/build/reports/unified-device-performance.json
            python3 scripts/collect_pr19_display_performance.py
            python3 scripts/run_disguise_restart.py
            python3 scripts/run_import_cleanup_restart.py
            python3 scripts/run_restore_process_death.py
            python3 scripts/run_voided_package_restart.py
            python3 scripts/run_ansm_write_process_death.py
            python3 scripts/run_lab_panel_restart.py
            python3 scripts/run_undo_skipped_restart.py
            python3 scripts/run_medical_records_restart.py
            python3 scripts/run_attachment_poc_restart.py
            python3 scripts/collect_attachment_poc_evidence.py --output app/build/reports/attachment-poc-evidence.json
            python3 scripts/run_attachment_gate3_red.py
            python3 scripts/run_demo_capture.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-test-results
          path: |
            core/data/build/reports/androidTests/
            core/data/build/reports/ansm-write-process-death/
            core/data/build/reports/gate2/
            core/data/build/reports/gate3/
            core/data/build/reports/b3/
            app/build/reports/androidTests/
            app/build/reports/unified-device-performance.json
            app/build/reports/pr19-display-performance.json
            app/build/reports/package-history-evidence.json
            app/build/reports/attachment-poc-evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: demo-evidence
          path: app/build/reports/demo/

  attachment-poc-compatibility:
    # Only synthetic POC tests, keeping the existing complete API35 suite above.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: |
            adb logcat -G 16M
            ./gradlew :core:data:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=net.plainnotes.app.data.AttachmentFoundationAndroidTest,net.plainnotes.app.data.AttachmentSqlCipherMigrationTest,net.plainnotes.app.data.AttachmentKeyAndroidTest,net.plainnotes.app.data.Gate2StoreAndroidTest,net.plainnotes.app.data.Gate2RestartAndroidTest,net.plainnotes.app.data.Gate2SafAndroidTest,net.plainnotes.app.data.Gate2ContextAndroidTest,net.plainnotes.app.data.Gate3ProcessLockAndroidTest,net.plainnotes.app.data.B3GateAndroidTest,net.plainnotes.app.data.B3RestartAndroidTest,net.plainnotes.app.data.Ansm03b0InventoryAndroidTest,net.plainnotes.app.data.BackupReplacementAndroidTest,net.plainnotes.app.data.ReferencePersistenceAndroidTest,net.plainnotes.app.data.ReferenceMigrationAndroidTest,net.plainnotes.app.data.MeasuredContainerAndroidTest,net.plainnotes.app.data.MeasuredConsumptionAndroidTest,net.plainnotes.app.data.MeasuredSaveCoordinatorAndroidTest,net.plainnotes.app.data.ReferenceAuditStreamingAndroidTest,net.plainnotes.app.data.P4LifecycleGrowthAndroidTest,net.plainnotes.app.data.DailyTrashCollisionAndroidTest,net.plainnotes.app.data.LabPanelDataAndroidTest --no-parallel --max-workers=2
            python3 scripts/run_attachment_foundation_restart.py
            python3 scripts/run_attachment_gate2_red.py
            python3 scripts/run_attachment_gate2_restart.py AFTER_CREATE
            python3 scripts/run_attachment_gate2_restart.py WRITE
            python3 scripts/run_attachment_gate2_restart.py IN_COMMIT
            python3 scripts/run_attachment_gate2_restart.py AFTER_COMMIT
            python3 scripts/run_b3_gate_restart.py BEFORE_COMMIT
            python3 scripts/run_b3_gate_restart.py AFTER_COMMIT
            python3 scripts/run_b3_gate_red.py
            ./gradlew :app:connectedFullDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=net.plainnotes.app.attachmentpoc --no-parallel --max-workers=2
            # China beta P0 regressions on API 26/29 (the full app suite runs on API 35 above).
            ./gradlew :app:connectedFullDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=net.plainnotes.app.shell.InAppNavigationLockAndroidTest,net.plainnotes.app.shell.ReminderTestDeviceTest --no-parallel --max-workers=2
            python3 scripts/run_attachment_poc_restart.py
            python3 scripts/collect_attachment_poc_evidence.py --output app/build/reports/attachment-poc-evidence.json
            python3 scripts/run_attachment_gate3_red.py
            python3 scripts/run_ansm_write_process_death.py
            python3 scripts/run_lab_panel_restart.py
            python3 scripts/run_demo_compat.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: attachment-poc-api${{ matrix.api }}
          path: |
            app/build/reports/demo/
            core/data/build/reports/androidTests/
            core/data/build/reports/ansm-write-process-death/
            core/data/build/reports/gate2/
            core/data/build/reports/gate3/
            core/data/build/reports/b3/
            app/build/reports/androidTests/
            app/build/reports/attachment-poc-evidence.json
