name: Android and domain checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew -PjvmOnly :core:domain:test :pk-engine:test :importer:test
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :core:data:testDebugUnitTest :core:reminder:testDebugUnitTest :app:testFullDebugUnitTest lintFullDebug :app:assembleFullDebug :app:assembleFullRelease :core:data:assembleDebugAndroidTest :app:assembleFullDebugAndroidTest
      - name: Sublingual P0 arithmetic and synthetic calibration audit
        run: |
          python3 -m unittest discover -s tools/pk-audit -p 'test_*.py'
          ./gradlew -PjvmOnly :pk-engine:test --tests '*SublingualP0AuditTest' --rerun-tasks --no-parallel --max-workers=2
          python3 tools/pk-audit/sublingual_compare.py --output app/build/reports/pk-p0-comparison
      - run: python3 scripts/check_release_manifest.py
      - run: git diff --exit-code -- core/data/schemas docs/PLAN.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: build-results
          path: |
            app/build/reports/tests/
            app/build/reports/pk-p0/
            app/build/reports/pk-p0-comparison/
            pk-engine/build/reports/pk-p0/
            app/build/reports/lint-results-*
            core/*/build/reports/tests/
            pk-engine/build/reports/tests/
            importer/build/reports/tests/
  device-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :core:data:connectedDebugAndroidTest --no-parallel --max-workers=2
            ./gradlew :app:connectedFullDebugAndroidTest --no-parallel --max-workers=2
            python3 scripts/run_disguise_restart.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: device-test-results
          path: |
            core/data/build/reports/androidTests/
            app/build/reports/androidTests/
