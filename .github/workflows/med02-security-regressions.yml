name: MED-02 bounded security regressions
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: med02-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-api26-27:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 27]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest :core:data:assembleDebugAndroidTest --no-parallel --max-workers=2
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          heap-size: 192M
          disable-animations: true
          script: |
            python3 scripts/configure_ansm_native_runtime.py --api ${{ matrix.api }}
            python3 scripts/run_med02_security_native.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: med02-security-api${{ matrix.api }}
          path: |
            app/build/reports/med02-security/
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
            core/data/build/reports/med02-security/
