name: MED-02 preview low-memory safety
on:
  pull_request:
    paths:
      - 'app/src/main/java/net/plainnotes/app/attachments/AttachmentViewer.kt'
      - 'app/src/androidTest/java/net/plainnotes/app/attachmentpoc/ProductionViewerSafetyAndroidTest.kt'
      - '.github/workflows/med02-preview-low-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  viewer-api26-512m:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :app:assembleFullDebug :app:assembleFullDebugAndroidTest --no-parallel --max-workers=2
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 26
          arch: x86
          ram-size: 512M
          heap-size: 192M
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/configure_ansm_low_memory_avd.py
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 512 -qemu -m 512
          script: |
            python3 scripts/configure_ansm_native_runtime.py
            mkdir -p app/build/reports/viewer-safety
            adb install -r app/build/outputs/apk/full/debug/app-full-debug.apk
            adb install -r app/build/outputs/apk/androidTest/full/debug/app-full-debug-androidTest.apk
            adb shell am instrument -w -r -e class net.plainnotes.app.attachmentpoc.ProductionViewerSafetyAndroidTest -e viewerExpectedHeapMb 192 net.plainnotes.app.test/androidx.test.runner.AndroidJUnitRunner > app/build/reports/viewer-safety/native.txt 2>&1
            adb logcat -d > app/build/reports/viewer-safety/logcat.txt
            adb shell dmesg > app/build/reports/viewer-safety/kernel.txt 2>&1 || true
            adb exec-out run-as net.plainnotes.app cat files/synthetic-viewer-memory.txt > app/build/reports/viewer-safety/memory.txt
            python3 -c 'from pathlib import Path; s=Path("app/build/reports/viewer-safety/native.txt").read_text(); assert "OK (7 tests)" in s and not any(x in s for x in ("FAILURES!!!","INSTRUMENTATION_FAILED","Process crashed")); m=Path("app/build/reports/viewer-safety/memory.txt").read_text(); assert m.count("sampled_not_peak=true")==7'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: viewer-api26-512m
          path: app/build/reports/viewer-safety/
