name: P1 release acceptance (test-signed, synthetic data)
# Release-equivalent A/B/C/D builds (R8 on; resource shrinking / arm64 filter per scenario) signed with the public
# repository test key, exercised on disposable emulators. Never produces a distributable APK: no APK is uploaded,
# nothing is signed with the private release key, no release or tag is touched.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/release-acceptance.yml
      - scripts/release-acceptance/**
      - app/src/releaseAcceptanceTest/**
permissions:
  contents: read
concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        scenario: [A, B, C, D]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build exact and functional release-equivalent APK pairs
        env:
          S: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/p1"; mkdir -p "$OUT/result" "$OUT/apk"
          git rev-parse HEAD > "$OUT/result/source-sha.txt"
          for MODE in exact functional; do
            ./gradlew -I scripts/release-acceptance/acceptance.init.gradle -PhrtAcceptanceScenario=$S -PhrtAcceptanceMode=$MODE \
              --no-parallel --max-workers=2 :app:printReleaseAcceptanceConditions :app:assembleFullRelease :app:assembleFullReleaseAndroidTest \
              2>&1 | tee "$OUT/result/build-$MODE.log"
            mkdir -p "$OUT/apk/$MODE"
            cp app/build/outputs/apk/full/release/app-full-release.apk "$OUT/apk/$MODE/app.apk"
            cp app/build/outputs/apk/androidTest/full/release/app-full-release-androidTest.apk "$OUT/apk/$MODE/test.apk"
            cp -r app/build/release-acceptance/assets "$OUT/result/expectations-$MODE"
            ./gradlew --stop || true
          done
          (cd "$OUT/apk" && sha256sum */*.apk && ls -l */*.apk) | tee "$OUT/result/apk-identity.txt"
          unzip -l "$OUT/apk/exact/app.apk" | grep 'lib/' | tee "$OUT/result/exact-native-entries.txt"
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: python3 scripts/release-acceptance/run_device_acceptance.py --scenario ${{ matrix.scenario }} --exact-app "$RUNNER_TEMP/p1/apk/exact/app.apk" --exact-test "$RUNNER_TEMP/p1/apk/exact/test.apk" --functional-app "$RUNNER_TEMP/p1/apk/functional/app.apk" --functional-test "$RUNNER_TEMP/p1/apk/functional/test.apk" --out "$RUNNER_TEMP/p1/result/device-x86_64-api35"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-acceptance-${{ matrix.scenario }}
          path: ${{ runner.temp }}/p1/result/

  arm64-virtualization-probe:
    # Real ARM64 Android needs an arm64 host with hardware virtualization exposed to the job.
    # This records, without guessing, whether GitHub-hosted arm64 runners provide it.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - name: Probe hardware virtualization and the Android emulator accelerator
        run: |
          set +e
          OUT="$RUNNER_TEMP/probe"; mkdir -p "$OUT"
          {
            echo "runner=${{ matrix.runner }}"; uname -a; uname -m
            if [ "$(uname -s)" = Linux ]; then ls -l /dev/kvm; echo "kvm_exit=$?"; grep -m1 -i 'Features' /proc/cpuinfo; fi
            if [ "$(uname -s)" = Darwin ]; then sysctl kern.hv_support; sysctl machdep.cpu.brand_string; fi
            yes | sdkmanager --licenses >/dev/null
            sdkmanager emulator; echo "sdkmanager_emulator_exit=$?"
            ls "$ANDROID_HOME/emulator" 2>&1 | head
            "$ANDROID_HOME/emulator/emulator" -accel-check; echo "accel_check_exit=$?"
          } 2>&1 | tee "$OUT/probe-${{ matrix.runner }}.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p1-arm64-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/probe/
