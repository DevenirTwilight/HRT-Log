name: MED-02 library low-memory acceptance
on:
  pull_request:
    paths:
      - 'core/data/src/**/Library*.kt'
      - 'core/data/src/**/MedicalAttachmentOperation*.kt'
      - 'core/data/src/**/MedicalCollection*.kt'
      - 'core/data/src/**/MedicalArchive*.kt'
      - 'core/data/src/main/java/net/plainnotes/app/data/DatabaseAccess.kt'
      - 'core/data/src/main/java/net/plainnotes/app/data/NotesRepository.kt'
      - 'core/data/src/main/java/net/plainnotes/app/data/AttachmentTransaction.kt'
      - 'scripts/run_library_restore_restart.py'
      - 'scripts/run_library_collection_restart.py'
      - 'scripts/run_library_collection_transfer.py'
      - 'scripts/run_library_low_memory_acceptance.sh'
      - 'scripts/run_featherline_low_memory_acceptance.sh'
      - 'core/data/src/**/Featherline*.kt'
      - 'app/src/**/Featherline*.kt'
      - '.github/workflows/med02-library-low-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: med02-library-memory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  library-api26-512m:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      MED02_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo chmod a+rw /dev/kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 26
          arch: x86
          ram-size: 512M
          heap-size: 192M
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/configure_ansm_low_memory_avd.py
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 512 -qemu -m 512
          script: |
            python3 scripts/configure_ansm_native_runtime.py
            bash scripts/run_library_low_memory_acceptance.sh
            bash scripts/run_featherline_low_memory_acceptance.sh
      - name: Restore only encrypted collection in independent fresh API26 guest C
        uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 26
          arch: x86
          force-avd-creation: true
          ram-size: 512M
          heap-size: 192M
          disable-animations: true
          pre-emulator-launch-script: python3 scripts/configure_ansm_low_memory_avd.py
          emulator-options: -wipe-data -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 512 -qemu -m 512
          script: |
            python3 scripts/configure_ansm_native_runtime.py
            python3 scripts/run_library_collection_transfer.py restore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: med02-library-api26-512m
          path: |
            app/build/reports/featherline-low-memory/
            core/data/build/reports/androidTests/
            core/data/build/outputs/androidTest-results/
            core/data/build/reports/med02-generation-restart/
            core/data/build/reports/med02-collection-restart/
            core/data/build/reports/med02-operation-restart/
            core/data/build/reports/med02-generation-memory/
